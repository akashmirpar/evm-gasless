# Gasless relayer config. Copy to ./config.yaml and adjust per env.
#
# How config resolves (see src/config/yaml_reader.ts):
#   - This YAML is flattened to UPPER_SNAKE_CASE keys (e.g. database.postgres.host
#     -> DATABASE_POSTGRES_HOST) and read via ConfigService.get('<KEY>').
#   - `${VAR}` placeholders are expanded from the secret file (default:
#     /run/secrets/gasless_env, or $GASLESS_ENV_FILE, or ./.env) — never inline a
#     secret here.
#   - Secret-file values OVERRIDE the value set here at the same flattened key,
#     so any knob below can be overridden at deploy time by adding
#     `<KEY>=value` to the secret file (no YAML edit needed).
#
# Scalars are quoted so ConfigService returns strings uniformly (the code parses
# them with Number()/BigInt()/.trim() exactly as it did for env vars).
# --- HTTP server ---
service:
  port: '3100'
  host: '0.0.0.0'

# --- Postgres ---
database:
  postgres:
    host: '127.0.0.1'
    port: '5432'
    username: '${DATABASE_POSTGRES_USERNAME}'
    password: '${DATABASE_POSTGRES_PASSWORD}'
    database: 'gasless'

# --- Redis (cache + rate limiter) ---
redis:
  host: '127.0.0.1'
  port: '6379'
  # Optional ACL username. Leave the placeholder empty to auth as `default`
  # (password only); set it on shared Redis to auth as a per-service ACL user.
  username: '${REDIS_USERNAME}'
  password: '${REDIS_PASSWORD}'
  defaultTtlSeconds: '300'

# --- Delegate address registry ---
# deployed.json (delegate contract addresses per chain) is a GENERATED file
# written by contract/script/deploy.sh — kept out of this YAML. Optional absolute
# override; when empty the service walks up from its install dir to find
# chains/deployed.json.
DEPLOYED_JSON_PATH: '${DEPLOYED_JSON_PATH}'

# --- Chain registry (public config; formerly chains/chains.json) ---
# rpcUrls: first entry is the keyed provider endpoint (`${ANKR_API_KEY}` is the
# only secret, interpolated from the secret file); the rest are keyless public
# fallbacks. A keyed URL whose variable is unset is dropped with a boot warning.
# acceptedFeeTokens/mainFeeToken drive the fee path.
#
# EXCEPTION to the "quote every scalar" rule at the top of this file: `chainId`
# and `nativeDecimals` must stay UNQUOTED. ChainConfigService coerces them with
# Number() and rejects non-integers at boot, so a quoted value is caught rather
# than silently keying the registry by a string.
#
# Deploy-time override without rebuilding the image: set either
# `CHAINS_<NAME>_RPC_URLS` or `CHAINS_<chainId>_RPC_URLS` (comma-separated) in the
# secret file or process.env — both forms work, e.g. for BSC:
#   CHAINS_BSC_RPC_URLS=https://my-paid-bsc,https://backup-bsc
#   CHAINS_56_RPC_URLS=https://my-paid-bsc,https://backup-bsc
chains:
  - chainId: 56
    name: 'bsc'
    displayName: 'BNB Smart Chain'
    nativeSymbol: 'BNB'
    nativeDecimals: 18
    rangoChainName: 'BSC'
    rpcUrls:
      - 'https://rpc.ankr.com/bsc/${ANKR_API_KEY}'
      - 'https://bsc-rpc.publicnode.com'
      - 'https://bsc-dataseed.binance.org'
      - 'https://1rpc.io/bnb'
    acceptedFeeTokens:
      - '0x55d398326f99059ff775485246999027b3197955'
    mainFeeToken: '0x55d398326f99059ff775485246999027b3197955'
  - chainId: 8453
    name: 'base'
    displayName: 'Base'
    nativeSymbol: 'ETH'
    nativeDecimals: 18
    rangoChainName: 'BASE'
    rpcUrls:
      - 'https://rpc.ankr.com/base/${ANKR_API_KEY}'
      - 'https://base-rpc.publicnode.com'
      - 'https://mainnet.base.org'
      - 'https://1rpc.io/base'
    acceptedFeeTokens:
      - '0xfde4c96c8593536e31f229ea8f37b2ada2699bb2'
    mainFeeToken: '0xfde4c96c8593536e31f229ea8f37b2ada2699bb2'
  - chainId: 42161
    name: 'arbitrum'
    displayName: 'Arbitrum One'
    nativeSymbol: 'ETH'
    nativeDecimals: 18
    rangoChainName: 'ARBITRUM'
    rpcUrls:
      - 'https://rpc.ankr.com/arbitrum/${ANKR_API_KEY}'
      - 'https://arbitrum-one-rpc.publicnode.com'
      - 'https://arb1.arbitrum.io/rpc'
      - 'https://1rpc.io/arb'
    acceptedFeeTokens:
      - '0xfd086bc7cd5c481dcc9c85ebe478a1c0b69fcbb9'
    mainFeeToken: '0xfd086bc7cd5c481dcc9c85ebe478a1c0b69fcbb9'

# --- Operator wallet (fee-payer) ---
# One BIP-39 mnemonic derives the operator at m/44'/60'/0'/0/{index}. The
# mnemonic itself is a secret (only the ${VAR} reference lives here). A raw
# OPERATOR_PRIVATE_KEY is still read as a fallback from the secret file if the
# mnemonic is unset.
operator:
  mnemonic: '${OPERATOR_MNEMONIC}'
  mnemonicIndex: '${OPERATOR_MNEMONIC_INDEX}'

# --- Rango (swap routing for non-accepted fee tokens) ---
rango:
  apiUrl: 'https://api.rango.exchange'
  apiKey: '${RANGO_API_KEY}'
  httpTimeoutMs: '30000'

# --- Gasless fee / behaviour knobs ---
gasless:
  # Treasury address that receives the user's fee. Provided via the secret store.
  treasuryAddress: '${GASLESS_TREASURY_ADDRESS}'
  baseFeeMarkupPercent: '15'
  defaultGasUnits: '1500000'
  rangoSlippage: '5.0'
  createTtlSeconds: '90'
  txGasLimit: '2000000'
  tokenMetadataTtlSeconds: '86400'
  # Fee sizing mode: `bps` (spread over network cost via baseFeeMarkupPercent)
  # or `fixed` (price the network cost via the feed and add feeProfit per token).
  feeMode: 'bps'
  # fixed-mode per-token profit, human units: <chainId>:<TOKEN_or_address>:<amount>
  feeProfit: ''
  # Refuse to quote when the fee is worth less than the ceiling network cost.
  # Requires the price feed; off by default to preserve bps-mode behaviour.
  noLossCheck: 'false'
  # Headroom above simulated network cost the no-loss guard covers, in bps.
  # In bps mode keep baseFeeMarkupPercent >= this or the guard rejects most quotes.
  priorityHeadroomBps: '3000'
  # Echo `causes` (program logs, aggregator detail) in HTTP errors. Off — it is a
  # fingerprinting surface; the full detail always reaches the server logs.
  exposeErrorCauses: 'false'
  # TokenPriceRefreshJob cron, and the age past which the price blob is treated
  # as unusable so a wedged refresh cannot silently under-price.
  priceRefreshCron: '*/5 * * * *'
  priceMaxAgeSeconds: '900'

# --- Relayer broadcast loop ---
relayer:
  # Cron for the relayer job (6-field, seconds granularity).
  cron: '*/5 * * * * *'
  maxRetries: '6'
  retryBaseMs: '5000'

# --- Scheduler per-job cron overrides (optional) ---
# Empty = use the cron the job registers with (see relayer.cron above).
scheduler:
  evmRelayer:
    time: ''

# --- Dev/test only wallet fallback (never set in production) ---
# When no operator seed is set, the fee-payer falls back to TEST_MNEMONIC so a
# single seed can play both user and fee-payer in e2e tests.
test:
  mnemonic: '${TEST_MNEMONIC}'
