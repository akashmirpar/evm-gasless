# Gasless relayer config. Copy to ./config.yaml and adjust per env.
#
# How config resolves (see src/config/yaml_reader.ts):
#   - This YAML is flattened to UPPER_SNAKE_CASE keys (e.g. database.postgres.host
#     -> DATABASE_POSTGRES_HOST) and read via ConfigService.get('<KEY>').
#   - `${VAR}` placeholders are expanded from the secret file (default:
#     /run/secrets/gasless_env, or $GASLESS_ENV_FILE, or ./.env) — never inline a
#     secret here.
#   - Secret-file values OVERRIDE the value set here at the same flattened key,
#     so any knob below can be overridden at deploy time by adding
#     `<KEY>=value` to the secret file (no YAML edit needed).
#
# Scalars are quoted so ConfigService returns strings uniformly (the code parses
# them with Number()/BigInt()/.trim() exactly as it did for env vars).
# --- HTTP server ---
service:
  port: '3100'
  host: '0.0.0.0'

# --- Postgres ---
database:
  postgres:
    host: '127.0.0.1'
    port: '5432'
    username: '${DATABASE_POSTGRES_USERNAME}'
    password: '${DATABASE_POSTGRES_PASSWORD}'
    database: 'gasless'

# --- Redis (cache + rate limiter) ---
redis:
  host: '127.0.0.1'
  port: '6379'
  # Optional ACL username. Leave the placeholder empty to auth as `default`
  # (password only); set it on shared Redis to auth as a per-service ACL user.
  username: '${REDIS_USERNAME}'
  password: '${REDIS_PASSWORD}'
  defaultTtlSeconds: '300'

# --- Delegate address registry ---
# deployed.json (delegate contract addresses per chain) is a GENERATED file
# written by contract/script/deploy.sh — kept out of this YAML. Optional absolute
# override; when empty the service walks up from its install dir to find
# chains/deployed.json.
DEPLOYED_JSON_PATH: '${DEPLOYED_JSON_PATH}'

# --- Chain registry (public config; formerly chains/chains.json) ---
# rpcUrls: first entry is the keyed provider endpoint (`${ANKR_API_KEY}` is the
# only secret, interpolated from the secret file); the rest are keyless public
# fallbacks. A keyed URL whose variable is unset is dropped with a boot warning.
# acceptedFeeTokens/mainFeeToken drive the EVM fee path; `tokens` lists SPL fee
# tokens for Solana.
#
# EXCEPTION to the "quote every scalar" rule at the top of this file: `chainId`
# and `nativeDecimals` must stay UNQUOTED. ChainConfigService coerces them with
# Number() and rejects non-integers at boot, so a quoted value is caught rather
# than silently keying the registry by a string.
#
# Deploy-time override without rebuilding the image: set either
# `CHAINS_<NAME>_RPC_URLS` or `CHAINS_<chainId>_RPC_URLS` (comma-separated) in the
# secret file or process.env — both forms work, e.g. for BSC:
#   CHAINS_BSC_RPC_URLS=https://my-paid-bsc,https://backup-bsc
#   CHAINS_56_RPC_URLS=https://my-paid-bsc,https://backup-bsc
chains:
  - chainId: 56
    name: 'bsc'
    displayName: 'BNB Smart Chain'
    nativeSymbol: 'BNB'
    nativeDecimals: 18
    rangoChainName: 'BSC'
    rpcUrls:
      - 'https://rpc.ankr.com/bsc/${ANKR_API_KEY}'
      - 'https://bsc-rpc.publicnode.com'
      - 'https://bsc-dataseed.binance.org'
      - 'https://1rpc.io/bnb'
    acceptedFeeTokens:
      - '0x55d398326f99059ff775485246999027b3197955'
    mainFeeToken: '0x55d398326f99059ff775485246999027b3197955'
  - chainId: 8453
    name: 'base'
    displayName: 'Base'
    nativeSymbol: 'ETH'
    nativeDecimals: 18
    rangoChainName: 'BASE'
    rpcUrls:
      - 'https://rpc.ankr.com/base/${ANKR_API_KEY}'
      - 'https://base-rpc.publicnode.com'
      - 'https://mainnet.base.org'
      - 'https://1rpc.io/base'
    acceptedFeeTokens:
      - '0xfde4c96c8593536e31f229ea8f37b2ada2699bb2'
    mainFeeToken: '0xfde4c96c8593536e31f229ea8f37b2ada2699bb2'
  - chainId: 42161
    name: 'arbitrum'
    displayName: 'Arbitrum One'
    nativeSymbol: 'ETH'
    nativeDecimals: 18
    rangoChainName: 'ARBITRUM'
    rpcUrls:
      - 'https://rpc.ankr.com/arbitrum/${ANKR_API_KEY}'
      - 'https://arbitrum-one-rpc.publicnode.com'
      - 'https://arb1.arbitrum.io/rpc'
      - 'https://1rpc.io/arb'
    acceptedFeeTokens:
      - '0xfd086bc7cd5c481dcc9c85ebe478a1c0b69fcbb9'
    mainFeeToken: '0xfd086bc7cd5c481dcc9c85ebe478a1c0b69fcbb9'
  - chainId: -100
    name: 'solana'
    displayName: 'Solana'
    nativeSymbol: 'SOL'
    nativeDecimals: 9
    networkType: 'SOLANA'
    rangoChainName: 'SOLANA'
    rpcUrls:
      - 'https://rpc.ankr.com/solana/${ANKR_API_KEY}'
      - 'https://api.mainnet-beta.solana.com'
    tokens:
      USDC:
        address: 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v'
        decimals: 6
      USDT:
        address: 'Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB'
        decimals: 6
      xTSLA:
        address: 'XsDoVfqeBukxuZHWhdvWHBhgEHjGNst4MLodqsJHzoB'
        decimals: 8
      xNVDA:
        address: 'Xsc9qvGR1efVDFGLrVsmkzv3qi45LTBjeUKSPmx9qEh'
        decimals: 8
      xAAPL:
        address: 'XsbEhLAtcf6HdfpFZ5xEMdqW8nfAvcsP5bdudRLJzJp'
        decimals: 8
  - chainId: -102
    name: 'solana-devnet'
    displayName: 'Solana Devnet'
    nativeSymbol: 'SOL'
    nativeDecimals: 9
    networkType: 'SOLANA'
    rangoChainName: 'SOLANA_DEVNET'
    rpcUrls:
      - 'https://rpc.ankr.com/solana_devnet/${ANKR_API_KEY}'
      - 'https://api.devnet.solana.com'
    tokens:
      USDC:
        address: '4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU'
        decimals: 6

# --- Operator wallet (EVM + Solana fee-payer) ---
# One BIP-39 mnemonic derives BOTH operators: EVM at m/44'/60'/0'/0/{index},
# Solana at m/44'/501'/{index}'/0'. The mnemonic itself is a secret (only the
# ${VAR} reference lives here). Raw OPERATOR_PRIVATE_KEY / SOLANA_OPERATOR_* are
# still read as fallbacks from the secret file if the mnemonic is unset.
operator:
  mnemonic: '${OPERATOR_MNEMONIC}'
  mnemonicIndex: '${OPERATOR_MNEMONIC_INDEX}'

# --- Rango (swap routing for non-accepted fee tokens) ---
rango:
  apiUrl: 'https://api.rango.exchange'
  apiKey: '${RANGO_API_KEY}'
  httpTimeoutMs: '30000'

# --- Gasless fee / behaviour knobs ---
gasless:
  # Treasury addresses that receive the user's fee. Provided via the secret store.
  treasuryAddress: '${GASLESS_TREASURY_ADDRESS}'
  solanaTreasuryAddress: '${GASLESS_SOLANA_TREASURY_ADDRESS}'
  # Solana-only legacy fee-token whitelist, `<chainId>:<SYMBOL_or_address>`
  # comma-separated. This is a deliberate whitelist, NOT a default: leaving it
  # empty makes ChainConfigService.parseSolanaChain fall back to "accept every
  # SPL in the chain's `tokens` map", which silently widens acceptance to tokens
  # (e.g. SPL USDT) this list intentionally excludes. EVM chains ignore it and
  # use their own `acceptedFeeTokens` above.
  acceptedFeeTokens: '56:USDT,8453:USDT,42161:USDT,-100:USDC,-100:xTSLA,-100:xNVDA,-100:xAAPL'
  baseFeeMarkupPercent: '15'
  defaultGasUnits: '1500000'
  rangoSlippage: '5.0'
  createTtlSeconds: '90'
  txGasLimit: '2000000'
  maxPrefundLamports: '50000000'
  tokenMetadataTtlSeconds: '86400'
  # Fee sizing mode: `bps` (spread over network cost via baseFeeMarkupPercent)
  # or `fixed` (price the network cost via the feed and add feeProfit per token).
  feeMode: 'bps'
  # fixed-mode per-token profit, human units: <chainId>:<TOKEN_or_address>:<amount>
  feeProfit: ''
  # Refuse to quote when the fee is worth less than the ceiling network cost.
  # Requires the price feed; off by default to preserve bps-mode behaviour.
  noLossCheck: 'false'
  # Headroom above simulated network cost the no-loss guard covers, in bps.
  # In bps mode keep baseFeeMarkupPercent >= this or the guard rejects most quotes.
  priorityHeadroomBps: '3000'
  # Echo `causes` (program logs, aggregator detail) in HTTP errors. Off — it is a
  # fingerprinting surface; the full detail always reaches the server logs.
  exposeErrorCauses: 'false'
  # How the Solana user-SOL prefund is sized: `simulate` (exact SOL the user
  # consumes, floored at the scan) or `scan` (static ATA-create scan; the
  # automatic fallback when simulation is unavailable, not an operating mode).
  prefundSizing: 'simulate'
  # TokenPriceRefreshJob cron, and the age past which the price blob is treated
  # as unusable so a wedged refresh cannot silently under-price.
  priceRefreshCron: '*/5 * * * *'
  priceMaxAgeSeconds: '900'

# --- Relayer broadcast loop ---
relayer:
  # Cron for the EVM relayer job (6-field, seconds granularity).
  cron: '*/5 * * * * *'
  # Cron for the Solana relayer job. Declared empty so a deploy-time
  # RELAYER_SOLANA_CRON (process.env / secret file) is honored via the config
  # fold; when empty the job falls through to relayer.cron (the consumer uses
  # trim-truthy, so '' is not treated as a literal empty cron).
  solanaCron: ''
  maxRetries: '6'
  retryBaseMs: '5000'

# --- Scheduler per-job cron overrides (optional) ---
# Empty = use the cron the job registers with (see relayer.cron above).
scheduler:
  evmRelayer:
    time: ''
  solanaRelayer:
    time: ''

# --- Solana ---
solana:
  rpc:
    perUrlRetries: '1'
    perUrlRetryDelayMs: '250'
  # Comma-separated ATA-create instruction discriminators counted as user-paid.
  ataCreateDiscriminators: '0,1'
  defaultPriorityMicrolamportsPerCu: '500000'
  maxPriorityMicrolamportsPerCu: '2000000'
  dynamicPriorityEnabled: 'true'
  # Bumped 75 -> 90 on 2026-07-09 after G1 mempool-drop failures under real
  # congestion: p75 (~2900 lamports at the time) loses ~25% of the auction.
  # Restored here after the RIN-135 config move silently reverted it to 75.
  dynamicPriorityPercentile: '90'
  minFeeLamports: '666666'
  # Broadcast mode: `single` (classic) or `bundled` (Jito atomic bundle).
  # Declared so a deploy-time SOLANA_BUNDLED_MODE_ENABLED=false (process.env or
  # secret file) overrides it — the config loader folds env/secret over declared
  # YAML keys (yaml_reader.loadConfig), so a literal here no longer masks the
  # disable path. Set to 'false' to reject explicit `bundled` requests.
  bundledModeEnabled: 'true'
  modeDefault: 'single'
  jito:
    bundleUrl: 'https://mainnet.block-engine.jito.wtf/api/v1/bundles'
    uuid: '${SOLANA_JITO_UUID}'
    # Raised 5000 -> 200000 on 2026-07-23 after live e2e: a swap-fee bundle
    # (Rango swap + prefund tx) was NOT included by Jito at 5000 across repeated
    # attempts — the bundle expired and the request went FAILED_PERMANENT. The
    # same bundle landed first try at 200000. 5000 is only competitive for the
    # light single-transfer bundle; heavier swap bundles need a real tip.
    # ~200k lamports ≈ $0.03 at $150 SOL, and the user pays it via the estimate.
    tipLamports: '200000'
  broadcast:
    skipPreflight: 'true'
    maxRetries: '5'
  operator:
    # Solana fee-payer key comes from the unified `operator.mnemonic` above.
    # Comma-separated operator-owned Address Lookup Table addresses. Empty = none.
    altAddresses: ''

# --- Dev/test only wallet fallback (never set in production) ---
# When no operator seed is set, the fee-payer falls back to TEST_MNEMONIC so a
# single seed can play both user and fee-payer in e2e tests.
test:
  mnemonic: '${TEST_MNEMONIC}'
  solanaAccountIndex: '${TEST_SOLANA_ACCOUNT_INDEX}'
